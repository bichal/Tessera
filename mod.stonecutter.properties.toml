# Tessera build configuration. Merged at configuration time with
# ../bichal-build-logic/common.stonecutter.properties.toml (bichal.settings):
# any table declared here replaces the common table of the same name.

# No [jvm.modules.*] tables: Tessera needs no preview features or extra modules.
# Native access goes through JNI (works on every JDK without flags), and SIMD
# math goes through Celeris's VectorOperations facade, which falls back to
# scalar code when jdk.incubator.vector is not enabled.

[mod]
id = "tessera"
name = "Tessera"
group = "net.bichal.mods"
package = "net.bichal.mods.tessera"
version = "0.4.0"
authors = "Bichal"
description = "Tessera: Minecraft's textures take less video memory, and look the same."
side = "CLIENT"
issues = "https://github.com/bichal/Tessera/issues"
# Packed into the jar by bichal-build-logic: icon (square) for Fabric's mod
# list, banner (wide) for NeoForge's. The README and the sites use the same files.
icon = "docs/media/logo.png"
banner = "docs/media/banner.png"

# Celeris is both a compile dependency and a required runtime mod (declared in
# neoforge.mods.toml). bichal-build-logic resolves `artifact` ({mc} = the
# Minecraft version being built) from mavenLocal() first, then from `maven`.
# version: artifact version compiled against.
# version_range: versions NeoForge accepts at runtime.
# (No end-of-line comments: the build's TOML readers do not strip them.)
[depends_on.celeris]
version = "0.3.2"
version_range = "[0.3.2,)"
artifact = "net.bichal.mods:celeris-{mc}"
maven = "https://bichal.github.io/Celeris/maven"
repo = "bichal/Celeris"

# JNI bridge (native/, CMake), staged from natives/<os>/<arch>/ into the jar: bc7enc_rdo (BC7, BC1)
# and ARM's astc-encoder (ASTC, with NEON on Apple Silicon and Linux AArch64). Android launchers run
# on bionic libc, which cannot load these; they use the pure-Java encoders. CI
# (bichal-build-logic mod-ci.yml): ci_prepare vendors both encoders before every native build;
# ci_linux_script builds both Linux platforms in one Ubuntu 20.04 container (binaries load on
# glibc 2.17+), Windows and macOS use CMake on their own runners.
[natives.tessera_bridge]
cmake_dir = "native"
platforms = ["windows-x86_64", "linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64"]
ci_linux_script = "native/build-linux.sh"

# Sources the bridge compiles but the repository does not carry: `bichal vendor` (and CI, before
# the native build) fetches them at the pinned commit. From bc7enc_rdo only the block encoders
# (bc7enc, rgbcx) and the BC7 decoder; astc-encoder is used as published.
[vendor.bc7enc_rdo]
git = "https://github.com/richgel999/bc7enc_rdo.git"
commit = "b9438627eef73a1157e84201b6fa6eb2ffd6d9f0"
dest = "native/vendor/bc7enc_rdo"
copy = [
  "bc7enc.h", "bc7enc.cpp", "rgbcx.h", "rgbcx.cpp", "rgbcx_table4.h", "rgbcx_table4_small.h",
  "bc7decomp.h", "bc7decomp.cpp", "LICENSE",
]

[vendor.astcenc]
git = "https://github.com/ARM-software/astc-encoder.git"
commit = "d0f91386350222fcbf6da533c0f7a3f9b5c6b783"
dest = "native/vendor/astcenc"
copy = ["Source/astcenc*.cpp", "Source/astcenc*.h"]
skip = ["astcenccli_*"]
rename = { "LICENSE.txt" = "LICENSE" }

# Only the transcoder module, for its bc7f encoder (the BC7 path); KTX2, zstd and the other
# transcoder targets are compiled out (native/CMakeLists.txt).
[vendor.basis_universal]
git = "https://github.com/BinomialLLC/basis_universal.git"
commit = "073eb6a0a34a23d77e75e54f41dcd9653a52da83"
dest = "native/vendor/basisu"
copy = ["transcoder/basisu*", "LICENSE", "NOTICE"]

# Third-party code inside the jar (ids from bichal-build-logic/legal/catalog.toml).
[legal.third_party]
components = ["bc7enc_rdo", "astcenc", "basis_universal"]

# Releases and descriptions (bichal-build-logic/publishing). README.md is the
# description on GitHub, Modrinth and CurseForge. Per-system jars (only that
# OS's natives; "java" = none) are attached to GitHub releases only.
[publish]
modrinth_id = "olpctCIW"
curseforge_id = "1643537"
curseforge_slug = "tessera"
platforms = ["windows", "linux", "macos", "java"]
client_side = "required"
server_side = "unsupported"

# github: README links to that repository become Celeris's page on each site.
[publish.dependencies.celeris]
type = "required"
modrinth = "sQphaM3I"
curseforge = "celeris"
github = "bichal/Celeris"

# CI also runs `selftest`: a headless client (Xvfb + Mesa) reads every
# compressed atlas back and checks it against its sprites (TesseraSelfTest).
[ci]
gradle_tasks = "build buildAndCollect selftest"
display = true

# Versions: bichal-build-logic's "bichal" profile (1.21.1, 1.21.10, 1.21.11,
# 26.1), each checked in CI by the client self-test.
[stonecutter]
profile = "bichal"
vcs_version = "1.21.1"
# Every version is built for NeoForge ("1.21.1") and Fabric ("1.21.1-fabric");
# loader-specific code reads //? if fabric { ... } (Stonecutter constants).
loaders = ["neoforge", "fabric"]

# bichal compat: every version a build claims (game_versions) runs the same
# self-test in a real game client of that version before it is claimed.
[compat]
side = "client"
jvm_args = ["-Dtessera.selftest=true", "-Xmx2G"]
report = "tessera-selftest.txt"
timeout_minutes = 25
client_options = ["onboardAccessibility:false", "narrator:0", "soundCategory_master:0.0", "renderDistance:2"]

[compression]
# BC7 quality preset 0-7 used by dev runs (tessera.compression.defaultQualityPreset).
default_quality_preset = 3

# modmenu_version: Mod Menu (Fabric) whose API the config-screen entrypoint compiles against
# (compile only: not bundled, not required).

# What each build claims to support (merged with the common TOML's block for
# that version). Every game_versions entry passed the self-test in a real client
# of that version (`bichal compat`). The 1.21.10
# build's GpuTexture code path is what 1.21.5 introduced, so it takes 1.21.5+.
["1.21.1"]
minecraft_version_range = "[1.21,1.21.5)"
neo_version_range = "[21.0,21.5)"
game_versions = ["1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4"]
modmenu_version = "11.0.5"

["1.21.10"]
minecraft_version_range = "[1.21.5,1.21.11)"
neo_version_range = "[21.5,21.11)"
game_versions = ["1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10"]
modmenu_version = "16.0.1"

["1.21.11"]
minecraft_version_range = "[1.21.11,1.21.12)"
neo_version_range = "[21.11,21.12)"
game_versions = ["1.21.11"]
modmenu_version = "17.0.1"

["26.1"]
minecraft_version_range = "[26.1,26.4)"
neo_version_range = "[26.1,26.4)"
game_versions = ["26.1", "26.1.1", "26.1.2", "26.2", "26.3"]
modmenu_version = "18.0.2"
